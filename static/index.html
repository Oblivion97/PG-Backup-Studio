<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PG Backup Studio</title>
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc; --surface-3: #eef2f7;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --fg: #0f172a; --fg-2: #475569; --fg-3: #64748b;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff6ff; --accent-fg: #ffffff;
  --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
  --danger: #b91c1c; --danger-hover: #991b1b; --danger-soft: #fee2e2; --info-soft: #e0f2fe; --info: #0369a1;
  --side-bg: #0f172a; --side-fg: #cbd5e1; --side-fg-2: #94a3b8; --side-hover: #1e293b; --side-active: #1e3a8a;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
  --shadow-lg: 0 20px 40px -8px rgba(15, 23, 42, .25), 0 4px 12px rgba(15, 23, 42, .08);
  --radius: 8px; --radius-sm: 6px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #111827; --surface-2: #0f172a; --surface-3: #1f2937;
    --border: #1f2937; --border-strong: #334155;
    --fg: #e5e7eb; --fg-2: #9ca3af; --fg-3: #8b95a5;
    --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #172554; --accent-fg: #ffffff;
    --ok: #4ade80; --ok-soft: #052e16; --warn: #fbbf24; --warn-soft: #3b2405;
    --danger: #f87171; --danger-hover: #fca5a5; --danger-soft: #3f0d0d; --info-soft: #082f49; --info: #7dd3fc;
    --side-bg: #020617; --side-hover: #111827; --side-active: #1e3a8a;
    --shadow-lg: 0 20px 40px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #111827; --surface-2: #0f172a; --surface-3: #1f2937;
  --border: #1f2937; --border-strong: #334155;
  --fg: #e5e7eb; --fg-2: #9ca3af; --fg-3: #8b95a5;
  --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #172554; --accent-fg: #ffffff;
  --ok: #4ade80; --ok-soft: #052e16; --warn: #fbbf24; --warn-soft: #3b2405;
  --danger: #f87171; --danger-hover: #fca5a5; --danger-soft: #3f0d0d; --info-soft: #082f49; --info: #7dd3fc;
  --side-bg: #020617; --side-hover: #111827; --side-active: #1e3a8a;
  --shadow-lg: 0 20px 40px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--fg-2); }
.subtle { color: var(--fg-3); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
svg.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
.side { background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 650;
  font-size: 15px; letter-spacing: .1px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.brand-mark svg.icon { stroke: #fff; width: 17px; height: 17px; }
.brand small { display: block; font-weight: 400; color: var(--side-fg-2); font-size: 11.5px; }
.side-section { padding: 10px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--side-fg-2); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.side-section button { background: none; border: 0; color: var(--side-fg-2); cursor: pointer; padding: 2px 4px;
  border-radius: 4px; }
.side-section button:hover { color: #fff; background: var(--side-hover); }
.servers { overflow-y: auto; padding: 0 8px; flex: 1; min-height: 0; }
.srv { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none;
  color: var(--side-fg); border-radius: 6px; cursor: pointer; text-align: left; }
.srv:hover { background: var(--side-hover); }
.srv.active { background: var(--side-active); color: #fff; }
.srv .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv .host { font-size: 11.5px; color: var(--side-fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv.active .host { color: #bfdbfe; }
.srv .meta { min-width: 0; flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; flex: none; }
.dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
.dot.err { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
.side-add { margin: 6px 8px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
  border: 1px dashed #334155; background: none; color: var(--side-fg-2); cursor: pointer; width: calc(100% - 16px); }
.side-add:hover { color: #fff; border-color: #475569; background: var(--side-hover); }
.side-foot { border-top: 1px solid #1e293b; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--side-fg);
  background: none; border: 0; cursor: pointer; width: 100%; text-align: left; }
.side-link:hover { background: var(--side-hover); color: #fff; text-decoration: none; }
.side-link .count { margin-left: auto; background: #2563eb; color: #fff; border-radius: 10px; padding: 0 7px;
  font-size: 11.5px; font-weight: 600; }
.side-ver { padding: 4px 10px 2px; font-size: 11px; color: #64748b; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; }
.crumbs { display: flex; align-items: center; gap: 8px; padding-top: 16px; color: var(--fg-3); font-size: 12.5px; }
.crumbs b { color: var(--fg-2); font-weight: 550; }
.title-row { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; min-height: 44px; }
.title-row h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.2px; }
.tabs { display: flex; gap: 2px; margin-bottom: -1px; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border: 0; background: none;
  border-bottom: 2px solid transparent; color: var(--fg-2); cursor: pointer; font-weight: 550; white-space: nowrap; }
.tab:hover { color: var(--fg); text-decoration: none; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.tab .count { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 11.5px; }
.content { flex: 1; overflow-y: auto; padding: 24px 28px 48px; min-height: 0; }
.content-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---------- building blocks */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h h2 { font-size: 14.5px; font-weight: 650; margin: 0; }
.card-h .desc { color: var(--fg-3); font-size: 12.5px; }
.card-b { padding: 16px 18px; }
.card-f { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2);
  border-radius: 0 0 var(--radius) var(--radius); display: flex; gap: 8px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px;
  background: var(--border); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.stat { background: var(--surface); padding: 14px 18px; }
.stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--fg-3); font-weight: 600; }
.stat .v { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .s { font-size: 12px; color: var(--fg-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg);
  font-weight: 550; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: var(--danger-hover); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.icon-only { width: 32px; padding: 0; }
.btn.sm.icon-only { width: 28px; }
.btn.lg { height: 38px; padding: 0 18px; font-size: 14.5px; }
.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px;
  font-weight: 600; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; line-height: 18px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.field .hint { font-size: 12px; color: var(--fg-3); }
.input, select.input, textarea.input { height: 34px; padding: 0 10px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.input:disabled { background: var(--surface-3); color: var(--fg-3); }
.input.sm { height: 28px; font-size: 13px; padding: 0 8px; }
.input.invalid { border-color: var(--danger); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid .span-2 { grid-column: span 2; }
.check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; user-select: none; }
.check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
.check .t { font-weight: 550; }
.check .d { display: block; font-size: 12px; color: var(--fg-3); font-weight: 400; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden;
  background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 12px; height: 30px; cursor: pointer; color: var(--fg-2);
  font-weight: 550; border-right: 1px solid var(--border); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg.sm button { height: 26px; padding: 0 9px; font-size: 12.5px; }
.radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.radio-card { border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
  background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 3px; }
.radio-card:hover { border-color: var(--accent); }
.radio-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.radio-card .t { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.radio-card .d { font-size: 12.5px; color: var(--fg-2); }

.alert { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid;
  font-size: 13.5px; align-items: flex-start; }
.alert svg.icon { margin-top: 1px; }
.alert.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); color: var(--fg); }
.alert.info svg.icon { color: var(--info); }
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.alert.warn svg.icon { color: var(--warn); }
.alert.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.alert.danger svg.icon { color: var(--danger); }
.alert.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.alert.ok svg.icon { color: var(--ok); }
.alert .body { flex: 1; min-width: 0; }
.alert .body b { display: block; margin-bottom: 2px; }

/* ---------- tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; }
table.t th { position: sticky; top: 0; background: var(--surface-2); font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--fg-3); font-weight: 650; text-align: left; padding: 9px 14px;
  border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--fg); }
table.t td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t tr.large td { background: color-mix(in srgb, var(--warn-soft) 55%, transparent); }
table.t tr.large:hover td { background: var(--warn-soft); }
table.t .actions { display: flex; gap: 6px; justify-content: flex-end; }
.cell-name { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.cell-name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.search { position: relative; }
.search svg.icon { position: absolute; left: 9px; top: 9px; color: var(--fg-3); width: 15px; height: 15px; }
.search .input { padding-left: 30px; width: 240px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border-strong); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; color: var(--fg-3); background: var(--surface-2); }

.empty { text-align: center; padding: 48px 24px; color: var(--fg-2); }
.empty .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; margin: 0 auto 14px; }
.empty .ic svg.icon { width: 24px; height: 24px; }
.empty h3 { margin: 0 0 4px; color: var(--fg); font-size: 16px; }
.empty p { margin: 0 auto 16px; max-width: 440px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--fg-3); }
.loading .spin { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; }
.skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3));
  background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- progress / jobs */
.bar { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
.bar.ok > i { background: var(--ok); }
.bar.danger > i { background: var(--danger); }
.bar.warn > i { background: var(--warn); }
.bar.indet > i { width: 30% !important; animation: indet 1.3s ease-in-out infinite; }
@keyframes indet { from { left: -30%; } to { left: 100%; } }
.job { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.job.open { box-shadow: var(--shadow); border-color: var(--border-strong); }
.job-h { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
.job-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.job-ic.restore { background: color-mix(in srgb, #8b5cf6 15%, transparent); color: #8b5cf6; }
.job-title { font-weight: 650; display: flex; align-items: center; gap: 8px; min-width: 0; }
.job-title .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-sub { font-size: 12.5px; color: var(--fg-3); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.job-prog { padding: 0 18px 14px 68px; display: flex; flex-direction: column; gap: 6px; }
.job-prog .line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.job-body { border-top: 1px solid var(--border); padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; }
.kv .k { font-size: 11.5px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.kv .v { font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { background: #0b1020; color: #cbd5e1; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px;
  max-height: 300px; overflow: auto; padding: 10px 0; line-height: 1.6; }
.log div { padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.log .t { color: #64748b; margin-right: 10px; display: inline-block; min-width: 52px; text-align: right; }
.log .error { color: #fca5a5; background: rgba(239, 68, 68, .1); }
.log .warning { color: #fcd34d; }
.errlist { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
.erritem { border: 1px solid var(--border); border-left: 3px solid var(--danger); border-radius: var(--radius-sm); padding: 8px 12px; background: var(--surface-2); }
.erritem.warning { border-left-color: var(--warn); }
.erritem.file { border-left-color: var(--border-strong); }
.erritem .o { font-weight: 600; font-size: 13px; }
.erritem pre { margin: 6px 0 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; color: var(--fg-2); }

/* ---------- overlays */
.backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .5); backdrop-filter: blur(2px); display: grid;
  place-items: center; z-index: 50; padding: 24px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 520px; max-width: 100%;
  max-height: calc(100vh - 48px); display: flex; flex-direction: column; animation: pop .14s ease-out; border: 1px solid var(--border); }
.modal.wide { width: 680px; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.modal-h { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 6px; }

/** DOM builder. Text is always set through text nodes, never parsed as HTML (decision 008 §2). */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'value') node.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') node[k] = !!v;

const $ = (id) => document.getElementById(id);

const fmt = {
  bytes(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
    let i = 0, v = Number(n);
    while (Math.abs(v) >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v.toFixed(0) : v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0)) + ' ' + u[i];
  },
  num(n) { return n === null || n === undefined ? '—' : Number(n).toLocaleString(); },
  dur(s) {
    if (s === null || s === undefined || isNaN(s)) return '—';
    s = Math.max(0, Math.round(s));
    if (s < 60) return s + ' s';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h ? `${h} h ${String(m).padStart(2, '0')} min` : `${m} min ${r} s`;

/* ======================================================================== API */

class ApiError extends Error {
  constructor(status, code, message) { super(message); this.status = status; this.code = code; }
}

let passwordPrompt = null;   // one prompt at a time; concurrent 401s wait on the same promise

/** fetch wrapper: our guard header, JSON both ways, `{error, code}` errors; asks for a password once on 401. */
async function api(method, path, body, retried) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: Object.assign({ 'X-PGBS': '1', 'Accept': 'application/json' }, body !== undefined ? { 'Content-Type': 'application/json' } : {}),
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    setOffline(true);
    throw new ApiError(0, 'offline', 'PG Backup Studio is not running. Start it with "python app.py" and retry.');
  }
  setOffline(false);
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (res.ok) return data;
  const err = new ApiError(res.status, (data && data.code) || 'unexpected', (data && data.error) || `Request failed (${res.status}).`);
  if (err.code === 'password_required' && !retried) {
    const sid = serverIdOf(path, body);
    if (sid) {
      setConn(sid, null);
      const ok = await askPassword(sid, err.message);
      if (ok) return api(method, path, body, true);
    }
  }
  if (err.code === 'password_required') {
    const sid = serverIdOf(path, body);
    if (sid) setConn(sid, 'err');
  }
  throw err;
}
function serverIdOf(path, body) {
  const m = /^\/api\/servers\/([^/]+)\//.exec(path);
  if (m && m[1] !== 'test') return decodeURIComponent(m[1]);
  return body && body.server_id ? body.server_id : null;
}

function setOffline(on) {
  const b = $('offline');
  if (on === !b.classList.contains('hidden')) return;
  b.classList.toggle('hidden', !on);
  if (on) {
    clear(b, icon('alert'), el('span', { class: 'grow', text: 'The PG Backup Studio server is not reachable. Start it with "python app.py".' }),
      el('button', { class: 'btn sm', type: 'button', onclick: () => location.reload() }, 'Retry'));
  }
}

  if (v === null) delete state.conn[sid]; else state.conn[sid] = v;
  renderServerList();
}

/* ======================================================================== toasts, modals, menus */

const modals = [];
/** In-page modal (never the browser's alert/confirm). Returns {root, body, foot, close, error, busy}. */
function modal({ title, sub, iconName, tone, wide, body, actions, onClose }) {
  const err = el('div', { class: 'modal-err grow', role: 'alert' });
  const foot = el('div', { class: 'modal-f' }, err);
  const b = el('div', { class: 'modal-b' }, body);
  const box = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    el('div', { class: 'modal-h' },
      iconName ? el('div', { class: 'modal-ic ' + (tone || '') }, icon(iconName)) : null,
      el('div', null, el('h3', { text: title }), sub ? el('div', { class: 'sub' }, sub) : null),
      el('button', { class: 'btn ghost sm icon-only x', type: 'button', 'aria-label': 'Close', onclick: () => m.close() }, icon('x'))),
    b, foot);
  const root = el('div', { class: 'backdrop', onmousedown: (e) => { if (e.target === root) m.close(); } }, box);
  const m = {
    root, body: b, foot,
    close() {
      if (!root.isConnected) return;
      root.remove();
      modals.splice(modals.indexOf(m), 1);
      if (onClose) onClose();
    },
    error(msg) { err.textContent = msg || ''; },

    if (f) f.focus();

}

    btn.disabled = true;

    clear(btn, btn._children);

function confirmBox({ title, message, confirmLabel = 'Confirm', danger, typed, extra }) {

/* ======================================================================== password prompt (decision 008 §4) */

function askPassword(sid, reason) {
  if (passwordPrompt) return passwordPrompt;
  const s = server(sid);
  passwordPrompt = new Promise((resolve) => {
    let ok = false;
    const input = el('input', { class: 'input', type: 'password', autocomplete: 'current-password', 'aria-label': 'Password' });
    const go = el('button', { class: 'btn primary', type: 'button' }, 'Connect');
    const cancel = el('button', { class: 'btn', type: 'button' }, 'Cancel');
    const m = modal({
      title: 'Password required', iconName: 'key',
      sub: s ? `${s.name} · ${s.user}@${s.host}:${s.port}` : '',
      body: [
        /rejected/i.test(reason || '') ? el('div', { class: 'alert danger' }, icon('alert'), el('div', { class: 'body', text: reason })) : null,
        el('div', { class: 'field' }, el('label', null, 'Password'), input,
          el('div', { class: 'hint' }, 'Kept in memory until the app stops. It is not saved to disk.')),
      ],
      actions: [cancel, go],
      onClose: () => { passwordPrompt = null; resolve(ok); },
    });
    cancel.onclick = () => m.close();
    const submit = async () => {
      busy(go, true, 'Connecting…');
      m.error('');
      try {
        const info = await api('POST', `/api/servers/${enc(sid)}/connect`, { password: input.value }, true);
        state.info[sid] = info;
        state.conn[sid] = 'ok';
        ok = true;

  return passwordPrompt;
}

    await loadDatabases(sid);

    if (stale(token)) return;
    if (e.code !== 'password_required') setConn(sid, 'err');
    errorCard(view, e, () => route());
    renderHeader();

  if (stale(token)) return;
  renderHeader();

    const bad = fnMode ? [] : c.tables.filter((t) => t.option_error);
    if (!fnMode && (c.problems.length || bad.length)) {

async function viewRestore(view, token) {
  const sid = state.route.sid;
  loadingView(view);
  let hist, dbs;
  try {
    [hist, dbs] = await Promise.all([api('GET', '/api/history'), state.dbs[sid] ? Promise.resolve(state.dbs[sid]) : loadDatabases(sid)]);
  } catch (e) { if (!stale(token)) errorCard(view, e, () => route()); return; }
  if (stale(token)) return;
  renderHeader();
  state.history = hist;
  const pre = state.restorePrefill || {};
  state.restorePrefill = null;
  if (!state.restore || state.restore.sid !== sid || pre.history_id || pre.target) {
    const r = { sid, source: 'history', history_id: null, file: '', mode: 'create', existing: '', newName: '', owner: '', confirm: '',
      allow_non_empty: false, on_error: 'continue', single_transaction: false, contents: null };
    const backups = hist.filter((h) => h.kind === 'backup' && h.status === 'success' && h.mode !== 'functions');
    if (pre.history_id) {
      const h = backups.find((x) => x.id === pre.history_id);
      if (h) { r.history_id = h.id; r.newName = uniqueName(h.database + '_restored', dbs); }
    }
    if (pre.target) { r.mode = 'existing'; r.existing = pre.target; }
    state.restore = r;
    if (r.mode === 'existing' && r.existing) loadContents();
  }
  drawRestore(view);
}
function uniqueName(base, dbs) {
  const names = new Set((dbs || []).map((d) => d.name));

  while (names.has(n)) n = `${base}_${i++}`;
  return n;
}

    ['Tables', `${fmt.num(p.tables_done)} / ${fmt.num(p.tables_total)}`],

    ['Data read', `${fmt.bytes(p.data_bytes_done)} / ${fmt.bytes(p.data_bytes_total)}`],
    ['Written to file', fmt.bytes(p.bytes_written)],
    ['Elapsed', fmt.dur(j.elapsed_s)],
  ] : [
    ['File position', `${fmt.bytes(p.position)} / ${fmt.bytes(p.file_size)}`],
    ['Objects', fmt.num(p.objects_done)],
    ['Rows loaded', fmt.num(p.rows)],
    ['Errors', fmt.num(j.error_count)],
    ['Warnings', fmt.num(j.warning_count)],
    ['Elapsed', fmt.dur(j.elapsed_s)],
  ];
  const body = el('div', { class: 'job-body' },
    el('div', { class: 'kv' }, items.map(([k, v]) => el('div', null, el('div', { class: 'k', text: k }), el('div', { class: 'v', text: v, title: v })))));
  if (j.file) body.appendChild(el('div', { class: 'row', style: 'gap: 8px' }, icon('file'), el('span', { class: 'mono', text: j.file, style: 'word-break: break-all' })));
  if (j.history_error) body.appendChild(el('div', { class: 'alert warn' }, icon('alert'), el('div', { class: 'body', text: j.history_error })));
  const res = j.result;
  if (res && j.status !== 'running') body.appendChild(resultBlock(j, res));
  else if (j.status === 'failed' && j.error) body.appendChild(el('div', { class: 'alert danger' }, icon('alert'), el('div', { class: 'body' }, el('b', { text: 'The job failed' }), j.error)));
  const lines = d ? d.log : [];
  body.appendChild(el('div', null, el('div', { class: 'section-title', text: `Log${lines.length ? ` (last ${lines.length} lines)` : ''}` }),
    el('div', { class: 'log', role: 'log', 'aria-live': 'off' }, lines.length ? lines.map((l) => el('div', { class: l.error || l.level === 'error' ? 'error' : l.level === 'warning' ? 'warning' : '' },
      el('span', { class: 't', text: fmt.dur(l.t) }), l.msg)) : el('div', { text: 'Loading…' }))));
  return body;
}

function resultBlock(j, res) {
  const wrap = el('div', { class: 'stack' });
  if (j.status === 'failed' && j.error) wrap.appendChild(el('div', { class: 'alert danger' }, icon('alert'), el('div', { class: 'body' }, el('b', { text: 'The job failed' }), j.error)));
  if (j.kind === 'backup' && res.mode === 'functions') {
    const files = res.functions || [];
    if (j.status === 'success') wrap.appendChild(el('div', { class: 'alert ok' }, icon('check'), el('div', { class: 'body' },
      el('b', { text: `${fmt.plural(files.length, 'function file')} written` }),
      res.renamed ? `${fmt.plural(res.renamed, 'file')} got a number because the function name repeats.` : 'Every file is named after its function.')));
    if (files.length) wrap.appendChild(el('div', null, el('div', { class: 'section-title', text: `Files${files.length > 50 ? ' (first 50)' : ''}` }),
      el('div', { class: 'errlist' }, files.slice(0, 50).map((f) => el('div', { class: 'erritem file' },
        el('div', { class: 'o mono', text: f.file }), el('div', { class: 'mono subtle', text: f.name }))))));
  } else if (j.kind === 'backup') {
    if (res.partial && res.partial_tables && res.partial_tables.length) {
      wrap.appendChild(el('div', { class: 'alert warn' }, icon('info'), el('div', { class: 'body' }, el('b', { text: 'Partial backup' }),
        res.partial_tables.map((t) => el('div', { class: 'mono', text: `${t.table}: ${t.data === 'latest' ? `latest ${fmt.num(t.limit)} by ${t.order_by}` : 'schema only'}` })))));
    }
    if (res.skipped_fks && res.skipped_fks.length) wrap.appendChild(el('div', { class: 'alert warn' }, icon('alert'), el('div', { class: 'body',
      text: `${fmt.plural(res.skipped_fks.length, 'foreign key')} could not be written as NOT VALID and were left out; the statements are in the file header.` })));
    const warns = res.warnings || [];
    if (warns.length) wrap.appendChild(el('div', null, el('div', { class: 'section-title', text: `Warnings (${warns.length})` }),
      el('div', { class: 'errlist' }, warns.map((w) => el('div', { class: 'erritem warning' }, el('div', { text: typeof w === 'string' ? w : w.message || JSON.stringify(w) }))))));
  } else {
    const errs = res.errors || [];
    if (res.missing_roles && res.missing_roles.length) wrap.appendChild(el('div', { class: 'alert warn' }, icon('alert'), el('div', { class: 'body' },
      el('b', { text: 'Roles missing on this server' }), res.missing_roles.join(', '), el('div', { class: 'subtle', text: 'Grants and owners for these roles were skipped.' }))));
    if (errs.length) wrap.appendChild(el('div', null, el('div', { class: 'section-title', text: `Errors (${fmt.num(res.error_count || errs.length)}${errs.length < (res.error_count || 0) ? `, first ${errs.length} shown` : ''})` }),
      el('div', { class: 'errlist' }, errs.map((e) => el('div', { class: 'erritem' },
        el('div', { class: 'o', text: `${e.object || 'Statement'}${e.line ? ` · line ${e.line}` : ''}${e.sqlstate ? ` · ${e.sqlstate}` : ''}` }),
        el('div', { text: e.message }), e.sql ? el('pre', { text: e.sql }) : null)))));
    else if (j.status === 'success') wrap.appendChild(el('div', { class: 'alert ok' }, icon('check'), el('div', { class: 'body', text: `Restored ${fmt.num(res.objects)} objects and ${fmt.num(res.rows)} rows with no errors.` })));
    const warns = res.warnings || [];
    if (warns.length) wrap.appendChild(el('div', null, el('div', { class: 'section-title', text: `Warnings (${fmt.num(res.warning_count || warns.length)})` }),
      el('div', { class: 'errlist' }, warns.map((w) => el('div', { class: 'erritem warning' },
        el('div', { class: 'o', text: w.object || '' }), el('div', { text: typeof w === 'string' ? w : w.message }))))));
  }
  return wrap;
}

async function cancelJob(j) {
  const yes = await confirmBox({ title: `Cancel this ${j.kind}?`, confirmLabel: `Cancel ${j.kind}`, danger: true,
    message: j.kind === 'backup' ? 'The job stops at the next object or COPY chunk. The unfinished .part file is deleted.'
      : 'The job stops at the next statement or COPY chunk. Objects restored so far stay in the target database (unless single transaction was chosen).' });
  if (!yes) return;
  try {
    await api('POST', `/api/jobs/${enc(j.id)}/cancel`);
    toast('Cancel requested.', 'info');
    pollJobs();
  } catch (e) { toastError(e); }
}

/* ======================================================================== history */

async function viewHistory(view, token) {
  if (!state.history) loadingView(view);
  else drawHistory(view);
  try { state.history = await api('GET', '/api/history'); } catch (e) { if (!stale(token)) errorCard(view, e, () => route()); return; }
  if (stale(token)) return;
  drawHistory(view);
}

function drawHistory(view) {
  const all = state.history || [];
  const f = state.histFilter;
  const q = el('input', { class: 'input', placeholder: 'Search database, server or file', value: f.q, 'data-filter': '1', 'aria-label': 'Search history' });
  const kindSeg = el('div', { class: 'seg' }, [['all', 'All'], ['backup', 'Backups'], ['restore', 'Restores']].map(([k, label]) =>
    el('button', { type: 'button', class: f.kind === k ? 'on' : '', onclick: () => { f.kind = k; drawHistory(view); } }, label)));
  const statusSel = el('select', { class: 'input', style: 'width: 160px', 'aria-label': 'Status', onchange: (e) => { f.status = e.target.value; drawHistory(view); } },
    [['all', 'Any status'], ['success', 'Succeeded'], ['failed', 'Failed'], ['cancelled', 'Cancelled'], ['interrupted', 'Interrupted'], ['running', 'Running']].map(([k, l]) => el('option', { value: k, selected: f.status === k }, l)));
  const tbody = el('tbody');
  const drawRows = () => {
    const needle = f.q.toLowerCase();
    const rows = all.filter((h) => (f.kind === 'all' || h.kind === f.kind) && (f.status === 'all' || h.status === f.status) &&
      (!needle || [h.database, h.server && h.server.name, h.file].some((x) => x && String(x).toLowerCase().includes(needle))));
    if (!rows.length) {
      clear(tbody, el('tr', null, el('td', { colspan: '8' }, el('div', { class: 'empty' },
        el('div', { class: 'ic' }, icon('history')), el('h3', { text: all.length ? 'Nothing matches' : 'No history yet' }),
        el('p', { text: all.length ? 'Change the filters to see more entries.' : 'Every backup and restore is recorded here, with its file, size and outcome.' })))));
      return;
    }
    clear(tbody, rows.map(historyRow));
  };
  q.addEventListener('input', () => { f.q = q.value; drawRows(); });
  drawRows();
  const backups = all.filter((h) => h.kind === 'backup' && h.status === 'success');
  clear(view,
    el('div', { class: 'stats' },
      statBox('Entries', fmt.num(all.length), 'newest first'),
      statBox('Successful backups', fmt.num(backups.length), fmt.bytes(backups.reduce((a, h) => a + (h.size || 0), 0)) + ' in files'),
      statBox('Last backup', backups[0] ? fmt.ago(backups[0].started) : '—', backups[0] ? backups[0].database : ''),
      statBox('Failed', fmt.num(all.filter((h) => h.status === 'failed').length), 'backups and restores')),
    el('div', { class: 'card' },
      el('div', { class: 'toolbar' }, el('div', { class: 'search' }, icon('search'), q), kindSeg, statusSel, el('div', { class: 'grow' }),
        el('button', { class: 'btn', type: 'button', onclick: () => { state.history = null; route(); } }, icon('refresh'), 'Refresh')),
      el('div', { class: 'table-wrap' }, el('table', { class: 't' },
        el('thead', null, el('tr', null, el('th', null, 'Job'), el('th', null, 'When'), el('th', null, 'Server'), el('th', null, 'File'), el('th', { class: 'num' }, 'Size'),
          el('th', { class: 'num' }, 'Duration'), el('th', null, 'Result'), el('th', { class: 'num' }, 'Actions'))),
        tbody))));
}

function historyRow(h) {
  const isBackup = h.kind === 'backup';
  const canRestore = isBackup && h.status === 'success' && h.mode !== 'functions';
  const more = el('button', { class: 'btn sm icon-only ghost', type: 'button', 'aria-label': 'More actions', title: 'More actions' }, icon('more'));
  more.onclick = () => menu(more, [
    { icon: 'folder', label: 'Open folder', disabled: !h.file, action: () => openFolder(h) },
    { icon: 'activity', label: 'Show in Activity', disabled: !state.jobs.some((j) => j.id === h.id), action: () => go(`#/activity/${enc(h.id)}`) },
    '-',
    { icon: 'trash', label: 'Delete entry…', danger: true, disabled: h.status === 'running', action: () => deleteHistory(h) },
  ]);
  const counts = [];
  const has = (v) => v !== null && v !== undefined;
  if (isBackup && h.mode === 'functions') {
    if (has(h.objects)) counts.push(fmt.plural(h.objects, 'function file'));
  } else {
    if (has(h.objects)) counts.push(`${fmt.num(h.objects)} objects`);
    if (isBackup && has(h.tables)) counts.push(`${fmt.num(h.tables)} tables`);
    if (has(h.rows)) counts.push(`${fmt.num(h.rows)} rows`);
  }
  return el('tr', null,
    el('td', null, el('div', { class: 'cell-name' }, el('span', { class: 'job-ic ' + h.kind, style: 'width: 28px; height: 28px; border-radius: 7px' }, icon(isBackup ? 'backup' : 'restore')),
      el('div', { style: 'min-width: 0' }, el('div', { class: 'row', style: 'gap: 6px' }, el('span', { class: 'n', text: h.database }),
        h.partial ? el('span', { class: 'badge warn', title: (h.partial_tables || []).map((t) => t.table).join(', '), text: 'Partial' }) : null,
        h.gzip ? el('span', { class: 'badge', text: 'gzip' }) : null),
        el('div', { class: 'subtle', style: 'font-weight: 400', text: isBackup ? `Backup${h.mode && h.mode !== 'full' ? ` · ${MODE_LABEL[h.mode] || h.mode}` : ''}` : `Restore${h.target_mode ? ` · ${{ create: 'new database', existing: 'existing database', recreate: 'recreated' }[h.target_mode] || h.target_mode}` : ''}` })))),
    el('td', { class: 'nowrap', title: h.started }, el('div', { text: fmt.date(h.started) }), el('div', { class: 'subtle', text: fmt.ago(h.started) })),
    el('td', { text: (h.server && h.server.name) || '' }),
    el('td', { class: 'mono', style: 'max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap', title: h.file || '', text: fmt.basename(h.file) || '—' }),
    el('td', { class: 'num' }, fmt.bytes(h.size)),
    el('td', { class: 'num' }, fmt.dur(h.duration_s)),
    el('td', null, el('div', { class: 'row wrap', style: 'gap: 4px' }, statusBadge(h.status, h), h.warning_count ? el('span', { class: 'badge warn', text: fmt.plural(h.warning_count, 'warning') }) : null),
      counts.length ? el('div', { class: 'subtle', text: counts.join(' · ') }) : null,
      h.error && h.status !== 'success' ? el('div', { class: 'subtle', style: 'color: var(--danger); max-width: 280px; overflow:hidden; text-overflow: ellipsis; white-space: nowrap', title: h.error, text: h.error }) : null),
    el('td', null, el('div', { class: 'actions' },
      canRestore ? el('button', { class: 'btn sm', type: 'button', onclick: () => restoreFromHistory(h) }, icon('restore'), 'Restore') : null,
      more)));
}

function restoreFromHistory(h) {
  const sid = (h.server && server(h.server.id)) ? h.server.id : state.route.sid || (state.servers[0] && state.servers[0].id);
  if (!sid) { toast('Add a server to restore into first.', 'warn'); return; }
  state.restorePrefill = { history_id: h.id };
  go(`#/s/${enc(sid)}/restore`);
}

async function openFolder(h) {
  try {
    const r = await api('POST', `/api/history/${enc(h.id)}/open-folder`);
    toast(`Opened ${r.opened}`, 'ok');
  } catch (e) { toastError(e); }
}

async function deleteHistory(h) {
  const cb = el('input', { type: 'checkbox' });
  const yes = await confirmBox({ title: 'Delete this history entry?', confirmLabel: 'Delete', danger: true,
    message: `${h.kind === 'backup' ? 'Backup' : 'Restore'} of ${h.database} from ${fmt.date(h.started)}.`,
    extra: h.kind === 'backup' && h.file ? el('label', { class: 'check' }, cb, el('span', null, el('span', { class: 't', text: h.mode === 'functions' ? 'Also delete the function files and their folder' : 'Also delete the backup file' }),
      el('span', { class: 'd mono', text: h.file }))) : null });
  if (!yes) return;
  try {
    const res = await api('DELETE', `/api/history/${enc(h.id)}${cb.checked ? '?delete_file=1' : ''}`);
    toast(cb.checked ? (res.file_deleted ? 'Entry and file deleted.' : 'Entry deleted; the file was already gone.') : 'Entry deleted. The file was kept.', 'ok');
    state.history = (state.history || []).filter((x) => x.id !== h.id);
    if (state.route.view === 'history') drawHistory($('view'));
  } catch (e) { toastError(e); }
}

/* ======================================================================== start */

async function start() {
  applyTheme(store('theme') || 'auto');
  initShell();
  try {
    const info = await api('GET', '/api/app');
    state.version = info.version;
    for (const w of info.warnings || []) toast(w, 'warn', 'Data file problem');
    await loadServers();
  } catch (e) { toastError(e); }
  renderSideLinks();
  window.addEventListener('hashchange', route);
  route();
  pollJobs();
}
start();
</script>
</body>
</html>
